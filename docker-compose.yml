services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gitdocify-db
    environment:
      POSTGRES_USER: gitdocify
      POSTGRES_PASSWORD: gitdocify_dev
      POSTGRES_DB: gitdocify
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitdocify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gitdocify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
